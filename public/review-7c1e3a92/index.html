<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Закрытый материал</title>
    <style>
      :root{--paper:#fbfaf7;--ink:#272725;--muted:#66625c;--accent:#d84027;--line:rgba(216,64,39,.5);--faint:rgba(39,39,37,.14);--sans:Arial,Helvetica,"Segoe UI",sans-serif;--serif:Georgia,"Times New Roman",serif}
      *{box-sizing:border-box}
      body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font-family:var(--serif);text-rendering:optimizeLegibility}
      main{width:min(560px,100%)}
      .brand{padding-bottom:18px;border-bottom:1px solid var(--line);color:var(--accent);font:700 12px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase}
      .card{padding:54px 0 0}
      .eyebrow{color:var(--accent);font:700 10px/1.35 var(--sans);letter-spacing:.075em;text-transform:uppercase}
      h1{margin:12px 0 0;color:var(--accent);font:500 clamp(44px,9vw,68px)/.98 var(--sans);letter-spacing:-.055em}
      p{margin:24px 0 0;color:var(--muted);font-size:18px;line-height:1.48}
      form{margin-top:34px}
      label{display:block;margin-bottom:9px;color:var(--ink);font:700 12px/1.3 var(--sans)}
      .row{display:grid;grid-template-columns:1fr auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
      input{min-width:0;padding:15px 0;border:0;background:transparent;color:var(--ink);font:16px/1.2 var(--sans);outline:0}
      input:focus{box-shadow:inset 0 -2px 0 var(--accent)}
      button{min-width:132px;border:0;border-left:1px solid var(--line);background:var(--accent);color:#fff;font:700 13px/1.2 var(--sans);cursor:pointer}
      button:hover{background:#9d2c1c}
      button:disabled{cursor:wait;opacity:.65}
      .status{min-height:22px;margin-top:13px;color:var(--accent);font:700 12px/1.4 var(--sans)}
      .note{margin-top:32px;padding-top:18px;border-top:1px solid var(--faint);font:12px/1.45 var(--sans)}
      @media(max-width:520px){.card{padding-top:42px}.row{grid-template-columns:1fr}button{min-height:48px;border-top:1px solid var(--line);border-left:0}}
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Aivel · закрытый материал</div>
      <section class="card">
        <div class="eyebrow">Доступ по паролю</div>
        <h1>Введите пароль</h1>
        <p>Содержимое страницы зашифровано. Пароль не отправляется на сервер: расшифровка происходит только в этом браузере.</p>
        <form id="unlock">
          <label for="password">Пароль</label>
          <div class="row">
            <input id="password" name="password" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required autofocus>
            <button id="button" type="submit">Открыть</button>
          </div>
          <div class="status" id="status" role="status" aria-live="polite"></div>
        </form>
        <p class="note">После обновления страницы пароль потребуется снова. Он не сохраняется в браузере.</p>
      </section>
    </main>

        const form = document.getElementById("unlock");
        const input = document.getElementById("password");
        const button = document.getElementById("button");
        const status = document.getElementById("status");
        const decoder = new TextDecoder();
        const encoder = new TextEncoder();

        const fromBase64Url = (value) => {
          const base64 = value.replace(/-/g, "+").replace(/_/g, "/");
          const padded = base64 + "=".repeat((4 - (base64.length % 4)) % 4);
          return Uint8Array.from(atob(padded), (char) => char.charCodeAt(0));
        };

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          button.disabled = true;
          input.disabled = true;
          status.textContent = "Открываю…";

          try {
            const material = await crypto.subtle.importKey(
              "raw",
              encoder.encode(input.value.normalize("NFKC")),
              "PBKDF2",
              false,
              ["deriveKey"],
            );
            const key = await crypto.subtle.deriveKey(
              {
                name: "PBKDF2",
                salt: fromBase64Url(payload.salt),
                iterations: payload.iterations,
                hash: "SHA-256",
              },
              material,
              { name: "AES-GCM", length: 256 },
              false,
              ["decrypt"],
            );
            const plaintext = await crypto.subtle.decrypt(
              {
                name: "AES-GCM",
                iv: fromBase64Url(payload.iv),
                additionalData: encoder.encode(payload.aad),
                tagLength: 128,
              },
              key,
              fromBase64Url(payload.data),
            );
            input.value = "";
            const page = decoder.decode(plaintext);
            document.open();
            document.write(page);
            document.close();
          } catch {
            input.value = "";
            input.disabled = false;
            button.disabled = false;
            status.textContent = "Неверный пароль или данные повреждены.";
            input.focus();
          }
        });
      })();
